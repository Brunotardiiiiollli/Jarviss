name: Build-Jarvis-Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller nsis

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean jarvis_gui.spec
          makensis installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows-Build
          path: |
            dist/Jarvis/Jarvis.exe
            JarvisSetup.exe
